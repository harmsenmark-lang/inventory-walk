<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inventory">
<title>Inventory</title>
<style>
:root{
  --bg:#E7EAE4;
  --surface:#FFFFFF;
  --ink:#12161C;
  --muted:#5D6573;
  --line:#CBD0C6;
  --line-strong:#9AA294;
  --blue:#1B3A6B;
  --blue-soft:#E3E9F3;
  --green:#14663F;
  --green-soft:#DDEDE4;
  --r:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:560px;margin:0 auto;padding:32px 20px 48px}

header{
  border-bottom:2px solid var(--line-strong);
  padding-bottom:14px;
  margin-bottom:24px;
}
h1{
  font-size:26px;
  line-height:1.15;
  font-weight:600;
  letter-spacing:-.01em;
  margin:0 0 4px;
}
.sub{margin:0;color:var(--muted);font-size:14px}

nav{display:grid;gap:14px}

a.app{
  display:block;
  text-decoration:none;
  color:inherit;
  background:var(--surface);
  border:1px solid var(--line);
  border-left:5px solid var(--accent,var(--line-strong));
  border-radius:var(--r);
  padding:18px 18px 16px;
  min-height:96px;
}
a.app:active{background:var(--tint,var(--bg))}
a.app:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.walk{--accent:var(--blue);--tint:var(--blue-soft)}
.count{--accent:var(--green);--tint:var(--green-soft)}

.name{font-size:19px;font-weight:600;margin:0 0 5px}
.what{margin:0;color:var(--muted);font-size:14px;line-height:1.45}

footer{
  margin-top:28px;
  padding-top:14px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}
footer p{margin:0}

@media (min-width:600px){
  .wrap{padding-top:56px}
  h1{font-size:30px}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Inventory</h1>
    <p class="sub">Pick the sheet you're working from.</p>
  </header>

  <nav>
    <a class="app walk" href="walk.html">
      <p class="name">Inventory Walk</p>
      <p class="what">Counting through the building, shelf by shelf.</p>
    </a>

    <a class="app count" href="hs-inventory-count.html">
      <p class="name">High School Count</p>
      <p class="what">Full count sheet for the high school kitchen, with Excel export.</p>
    </a>
  </nav>

  <footer>
    <p>Both save on this device only. Export before you clear anything.</p>
  </footer>

</div>
</body>
</html>
